<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#111827" />
    <title>Portal Reparto</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #111827; color: #f9fafb; }
      .app { max-width: 480px; margin: 0 auto; padding: 16px 16px 48px; }
      header h1 { margin: 8px 0 2px; font-size: 22px; }
      .subtitle { margin: 0 0 12px; color: #9ca3af; font-size: 13px; }
      .card { background: #1f2937; border: 1px solid #374151; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
      label { display: block; font-size: 12px; color: #9ca3af; margin: 8px 0 4px; }
      input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #4b5563; background: #111827; color: #fff; font-size: 15px; }
      .row { display: flex; gap: 8px; }
      .row > * { flex: 1; }
      button { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #7c3aed; color: #fff; font-size: 15px; font-weight: 700; margin-top: 10px; }
      button.ghost { background: #374151; }
      button.danger { background: #991b1b; }
      button.ok { background: #047857; }
      button:disabled { opacity: .5; }
      .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 20px; background: #374151; margin-right: 6px; }
      .pill.live { background: #047857; animation: pulse 1.6s infinite; }
      @keyframes pulse { 50% { opacity: .6; } }
      .order { background: #1f2937; border: 1px solid #374151; border-radius: 14px; padding: 12px; margin-bottom: 10px; }
      .order h3 { margin: 0 0 2px; font-size: 15px; }
      .order .meta { font-size: 12px; color: #9ca3af; }
      .order .addr { font-size: 13px; margin: 6px 0; }
      .order .btns { display: flex; gap: 8px; }
      .order .btns button { margin-top: 8px; font-size: 13px; padding: 10px 4px; }
      .log { font-size: 12px; max-height: 160px; overflow-y: auto; }
      .log-line { padding: 2px 0; border-bottom: 1px solid #1f2937; color: #d1d5db; }
      .log-ok { color: #6ee7b7; } .log-error { color: #fca5a5; }
      .hint { font-size: 12px; color: #9ca3af; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <main class="app">
      <header>
        <h1>🛵 Portal Reparto</h1>
        <p class="subtitle">Ubicación en vivo · Portal 659 <span id="statusPill" class="pill">●</span></p>
      </header>

      <section class="card" id="loginCard">
        <label for="phone">Tu teléfono (repartidor)</label>
        <input id="phone" type="tel" placeholder="221..." autocomplete="off" />
        <label for="password">Contraseña</label>
        <input id="password" type="password" />
        <button id="btnLogin" type="button">Entrar</button>
        <p class="hint">Te vincula el comercio con un código (pantalla Vincular). Después entrás con teléfono + contraseña.</p>
      </section>

      <section class="card hidden" id="mainCard">
        <p class="hint" id="whoLine"></p>
        <div class="row">
          <button id="btnPerms" type="button" class="ghost">📍 Permisos GPS</button>
          <button id="btnBattery" type="button" class="ghost">🔋 Batería</button>
        </div>
        <div class="row">
          <button id="btnRefresh" type="button" class="ghost">🔄 Actualizar pedidos</button>
          <button id="btnLogout" type="button" class="ghost">Salir</button>
        </div>
        <p class="hint" id="shareLine"></p>
      </section>

      <div id="orders"></div>

      <section class="card">
        <div id="log" class="log" aria-live="polite"></div>
      </section>
    </main>
    <script src="./main.js"></script>
  </body>
</html>
