name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

# Un solo deploy a la vez: los pushes seguidos encolan en vez de solaparse
# (dos `compose up` concurrentes se pisan removiendo contenedores).
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 60m
          script: |
            set -euo pipefail
            cd /tmp
            SHA="${{ github.sha }}"
            curl -fsSL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o code.tgz "https://api.github.com/repos/sptortarolo-hue/portal659/tarball/$SHA"
            rm -rf /opt/portal659
            mkdir -p /opt/portal659
            tar -xzf code.tgz -C /opt/portal659 --strip-components=1

            # Swap 2G si no existe (evita OOM al buildear Next.js en un VPS de 1GB)
            SWAP_MB=$(free -m | awk '/^Swap:/{print $2}')
            if [ "${SWAP_MB:-0}" -lt 2048 ] && [ ! -f /swapfile2 ]; then
              fallocate -l 2G /swapfile2 && chmod 600 /swapfile2 && mkswap /swapfile2 && swapon /swapfile2
              grep -q 'swapfile2' /etc/fstab || echo '/swapfile2 none swap sw 0 0' >> /etc/fstab
            fi

            echo 'DATABASE_URL=${{ secrets.DATABASE_URL }}' > /opt/portal659/.env
            echo 'JWT_SECRET=${{ secrets.JWT_SECRET }}' >> /opt/portal659/.env
            echo 'NEXT_PUBLIC_SITE_URL=https://www.portal659.com.ar' >> /opt/portal659/.env
            echo 'POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}' >> /opt/portal659/.env
            echo 'UPLOAD_DIR=/app/uploads' >> /opt/portal659/.env
            echo 'RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}' >> /opt/portal659/.env
            echo "FROM_EMAIL=\"${{ secrets.FROM_EMAIL }}\"" >> /opt/portal659/.env
            echo 'MP_ACCESS_TOKEN=${{ secrets.MP_ACCESS_TOKEN }}' >> /opt/portal659/.env
            echo 'MP_PUBLIC_KEY=${{ secrets.MP_PUBLIC_KEY }}' >> /opt/portal659/.env
            echo 'MP_WEBHOOK_SECRET=${{ secrets.MP_WEBHOOK_SECRET }}' >> /opt/portal659/.env
            echo 'MP_CLIENT_ID=${{ secrets.MP_CLIENT_ID }}' >> /opt/portal659/.env
            echo 'MP_CLIENT_SECRET=${{ secrets.MP_CLIENT_SECRET }}' >> /opt/portal659/.env
            echo 'MP_TOKEN_KEY=${{ secrets.MP_TOKEN_KEY }}' >> /opt/portal659/.env
            # Llave maestra de Mercado Pago: encendida en producción (app de
            # MP con OAuth redirect + webhook ya configurados). Para apagar
            # todo MP sin redeploy de código, cambiar a MP_ENABLED=0.
            echo 'MP_ENABLED=1' >> /opt/portal659/.env
            echo 'UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }}' >> /opt/portal659/.env
            echo 'UPSTASH_REDIS_REST_TOKEN=${{ secrets.UPSTASH_REDIS_REST_TOKEN }}' >> /opt/portal659/.env
            echo 'VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}' >> /opt/portal659/.env
            echo 'VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}' >> /opt/portal659/.env
            echo 'VAPID_SUBJECT=${{ secrets.VAPID_SUBJECT }}' >> /opt/portal659/.env
            echo 'PRINT_BRIDGE_URL=http://printbridge:8791' >> /opt/portal659/.env
            PB_SECRET='${{ secrets.PRINT_BRIDGE_SECRET }}'
            if [ -z "$PB_SECRET" ]; then PB_SECRET=$(openssl rand -hex 24); fi
            echo "PRINT_BRIDGE_SECRET=$PB_SECRET" >> /opt/portal659/.env
            CS_SECRET='${{ secrets.CRON_SECRET }}'
            if [ -n "$CS_SECRET" ]; then echo "CRON_SECRET=$CS_SECRET" >> /opt/portal659/.env; fi
            echo 'LLM_API_KEY=${{ secrets.LLM_API_KEY }}' >> /opt/portal659/.env
            echo 'LLM_BASE_URL=${{ secrets.LLM_BASE_URL }}' >> /opt/portal659/.env
            echo 'LLM_MODEL=${{ secrets.LLM_MODEL }}' >> /opt/portal659/.env
            echo 'GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}' >> /opt/portal659/.env
            echo 'GEMINI_MODEL=${{ secrets.GEMINI_MODEL }}' >> /opt/portal659/.env
            echo 'GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}' >> /opt/portal659/.env
            echo 'GROQ_MODEL=${{ secrets.GROQ_MODEL }}' >> /opt/portal659/.env
            echo 'OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}' >> /opt/portal659/.env
            # Comercios: conserje por default. El flujo portal se activa por
            # slug del vendor central en el cerebro, no por env global.
            BT='${{ vars.BOT_TAKE_ORDERS }}'; echo "BOT_TAKE_ORDERS=${BT:-0}" >> /opt/portal659/.env
            SN='${{ vars.LLM_SITE_NAME }}'; echo "LLM_SITE_NAME=${SN:-Portal 659 wa-bot}" >> /opt/portal659/.env
            WB_SECRET='${{ secrets.WA_BOT_SECRET }}'
            if [ -z "$WB_SECRET" ]; then WB_SECRET=$(openssl rand -hex 24); fi
            echo "WA_BOT_SECRET=$WB_SECRET" >> /opt/portal659/.env
            # Credenciales R2 para el backup self-managed (scripts/backup.sh).
            echo 'R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}' >> /opt/portal659/.env
            echo 'R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}' >> /opt/portal659/.env
            echo 'R2_ENDPOINT=${{ secrets.R2_ENDPOINT }}' >> /opt/portal659/.env
            echo 'R2_BUCKET=${{ secrets.R2_BUCKET }}' >> /opt/portal659/.env
            # Verificación de Search Console: solo el token `content`, sin la
            # etiqueta (lo consume layout.tsx). Si el secret no existe, escribe
            # vacío y la app simplemente no renderiza el meta.
            echo 'GOOGLE_SITE_VERIFICATION=${{ secrets.GOOGLE_SITE_VERIFICATION }}' >> /opt/portal659/.env
            # Alertas del monitor de salud (Telegram). Si los secrets no están
            # se saltea la escritura: el monitor funciona igual y sólo no avisa
            # por el chat (fail-open, mismo criterio que el resto).
            TG_TOKEN='${{ secrets.TELEGRAM_BOT_TOKEN }}'
            TG_CHAT='${{ secrets.TELEGRAM_CHAT_ID }}'
            if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
              echo "TELEGRAM_BOT_TOKEN=$TG_TOKEN" >> /opt/portal659/.env
              echo "TELEGRAM_CHAT_ID=$TG_CHAT" >> /opt/portal659/.env
            fi

            # Snapshot previo al deploy: SOLO dump de DB (el tar de uploads queda
            # para el cron diario: con ~100 deploys/semana el tar de ~350MB por
            # deploy desbordaba el disco). Tolera primer arranque (sin
            # contenedores aún). Si falla NO bloquea el deploy.
            bash /opt/portal659/scripts/backup.sh --db-only || echo "WARNING: backup previo falló, continúa el deploy"

            cd /opt/portal659
            # Cert TLS para nginx :443. Si aún no pegaste el Origin CA de
            # Cloudflare en /opt/portal659-certs, se genera un placeholder
            # autofirmado para que nginx levante igual (el modo Strict se
            # enciende recién con el cert real instalado).
            # Se validan el .pem Y el .key: nginx parsea `ssl_certificate` al
            # arrancar, así que con uno solo de los dos el contenedor muere
            # entero → 80 y 443 caídos → Cloudflare devuelve 521. Antes sólo se
            # regeneraba si faltaba el .pem.
            mkdir -p /opt/portal659-certs
            if [ ! -s /opt/portal659-certs/origin.pem ] || [ ! -s /opt/portal659-certs/origin.key ]; then
              openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
                -keyout /opt/portal659-certs/origin.key \
                -out /opt/portal659-certs/origin.pem \
                -subj "/CN=portal659.com.ar" 2>/dev/null
            fi
            # Retry: absorbe carreras transitorias del daemon (ej. removal
            # of container ... is already in progress al recrear servicios).
            DEPLOYED=0
            for i in 1 2 3; do
              if docker compose up -d --build; then DEPLOYED=1; break; fi
              sleep 15
            done
            [ "$DEPLOYED" = "1" ]
            # nginx cachea el DNS del upstream al arrancar: si 'app' se recrea con un IP
            # nuevo, nginx apunta a un IP muerto y el sitio da 502. Restart = re-resuelve.
            # FORCE-RECREATE (no solo restart): nginx.conf se monta como volume de
            # ARCHIVO; al reemplazarlo, el bind-mount puede quedar apuntando al
            # inode viejo y el conf nuevo no tomaría hasta recrear el contenedor
            # (un restart no alcanza). Necesario para que cambios de nginx.conf
            # (ej. client_max_body_size) apliquen de verdad.
            docker compose up -d --force-recreate nginx
            docker image prune -f
            # Higiene de disco (incidente sep-2026: build cache + backups
            # llenaron el disco de 20G y voltearon Postgres): no falla el
            # deploy si no hay nada que podar.
            docker builder prune -f || true

            # Verificación REAL del borde. El healthcheck de compose es del
            # container 'app', así que un nginx roto (cert que no carga,
            # upstream muerto) pasaba desapercibido y el deploy terminaba
            # "Deploy completado!" con el sitio en 521 — pasó el 28-oct-2026.
            # Acá se pega al origen por 80 y por 443 como lo hace Cloudflare.
            EDGE_OK=no
            for _i in $(seq 1 12); do
              if curl -fsS --max-time 5 -H 'Host: www.portal659.com.ar' \
                   http://127.0.0.1/api/health >/dev/null 2>&1 \
                 && curl -fsSk --max-time 5 https://127.0.0.1/api/health >/dev/null 2>&1; then
                EDGE_OK=yes; break
              fi
              sleep 5
            done
            if [ "$EDGE_OK" != "yes" ]; then
              echo "ERROR: nginx NO responde en 80/443 tras el deploy — el deploy falla a propósito."
              echo "--- estado de nginx ---"
              docker inspect --format '{{.Name}} status={{.State.Status}} restarts={{.RestartCount}} exit={{.State.ExitCode}} err={{.State.Error}}' portal659-nginx 2>&1 || true
              echo "--- log de nginx ---"
              docker logs --tail 60 portal659-nginx 2>&1 || true
              exit 1
            fi
            echo "Borde verificado: nginx responde 200 en 80 y 443."

            # Backup diario self-managed (04:00 AR = 07:00 UTC). Self-healing:
            # reinstala rclone + script + crontab si faltan. /opt/portal659-backups
            # está FUERA de /opt/portal659: el deploy no lo borra nunca.
            mkdir -p /opt/portal659-backups/db /opt/portal659-backups/uploads
            cp -f /opt/portal659/scripts/backup.sh /opt/portal659-backups/backup.sh
            chmod +x /opt/portal659-backups/backup.sh
            if ! command -v rclone >/dev/null 2>&1; then
              curl -fsSL https://rclone.org/install.sh | bash
            fi
            printf '%s\n' \
              '07 7 * * * root /opt/portal659-backups/backup.sh >> /opt/portal659-backups/cron.log 2>&1' \
              > /etc/cron.d/portal659-backup
            chmod 644 /etc/cron.d/portal659-backup
            systemctl enable --now cron >/dev/null 2>&1 || service cron start >/dev/null 2>&1 || true

            # Recordatorios T-24/T-2 de turnos (cron self-managed, igual que backups).
            # Genera CRON_SECRET si falta; dispara cada 15 min contra el secreto.
            CRON_SECRET_VAL='${{ secrets.CRON_SECRET }}'
            if [ -z "$CRON_SECRET_VAL" ]; then CRON_SECRET_VAL=$(openssl rand -hex 16); fi
            echo "CRON_SECRET=$CRON_SECRET_VAL" >> /opt/portal659/.env
            printf '%s\n' \
              "*/15 * * * * root curl -fsS \"https://www.portal659.com.ar/api/cron/booking-reminders?secret=$CRON_SECRET_VAL\" >> /var/log/portal659-cron.log 2>&1" \
              "*/5 * * * * root curl -fsS \"https://www.portal659.com.ar/api/cron/order-nudge?secret=$CRON_SECRET_VAL\" >> /var/log/portal659-cron.log 2>&1" \
              "*/5 * * * * root curl -fsS \"https://www.portal659.com.ar/api/cron/delivery-stale?secret=$CRON_SECRET_VAL\" >> /var/log/portal659-cron.log 2>&1" \
              "*/20 * * * * root curl -fsS \"https://www.portal659.com.ar/api/cron/transfer-expiry?secret=$CRON_SECRET_VAL\" >> /var/log/portal659-cron.log 2>&1" \
              "0 13 * * * root curl -fsS \"https://www.portal659.com.ar/api/cron/plan-reminders?secret=$CRON_SECRET_VAL\" >> /var/log/portal659-cron.log 2>&1" \
              > /etc/cron.d/portal659-reminders
            chmod 644 /etc/cron.d/portal659-reminders
            systemctl enable --now cron >/dev/null 2>&1 || service cron start >/dev/null 2>&1 || true

            # Monitor de salud + auto-heal + forense (cron self-managed, cada 2
            # min, mismo patrón que los de arriba). Mira http://127.0.0.1 con
            # Host del sitio: pasa por nginx (el único que publica 80/443) →
            # app → Postgres, o sea justo lo que Cloudflare necesita para no
            # dar 521. La capa externa la cubre health-monitor.yml (mira la URL
            # pública, que desde el host no se ve si el VPS está apagado).
            # /opt/portal659-monitor queda FUERA de /opt/portal659: sobrevive al
            # rm -rf del deploy y guarda el estado entre corridas.
            mkdir -p /opt/portal659-monitor
            cp -f /opt/portal659/scripts/health-monitor.sh /opt/portal659-monitor/health-monitor.sh
            cp -f /opt/portal659/scripts/alert-telegram.sh /opt/portal659-monitor/alert-telegram.sh
            chmod +x /opt/portal659-monitor/health-monitor.sh /opt/portal659-monitor/alert-telegram.sh
            chmod 700 /opt/portal659-monitor
            printf '%s\n' \
              '*/2 * * * * root /opt/portal659-monitor/health-monitor.sh >> /opt/portal659-monitor/monitor.log 2>&1' \
              > /etc/cron.d/portal659-monitor
            chmod 644 /etc/cron.d/portal659-monitor
            # El log del monitor es /opt/portal659-monitor/monitor.log (lo lee
            # /admin/monitor): el redirect del cron apunta ahí, no a un
            # cron.log que nadie lee.
            systemctl enable --now cron >/dev/null 2>&1 || service cron start >/dev/null 2>&1 || true
            if ! pgrep -x cron >/dev/null 2>&1 && ! systemctl is-active --quiet cron 2>/dev/null; then
              echo "⚠️  El daemon cron NO quedó activo: el monitor cada 2 min no va a correr."
              echo "    El run sincrónico de abajo garantiza el primer status.json, pero revisar el cron a mano."
            fi
            # Primera corrida SINCRÓNICA: status.json existe de inmediato (el
            # panel /admin/monitor depende de ese archivo) y cualquier error
            # de la primera corrida aparece acá, no escondido en el cron.
            rm -f /opt/portal659-monitor/cron.log 2>/dev/null || true
            if /opt/portal659-monitor/health-monitor.sh; then
              if [ -s /opt/portal659-monitor/status.json ]; then
                echo "Monitor: status.json generado — el panel /admin/monitor tiene datos."
              else
                echo "⚠️  El monitor corrió 0 (ok) pero NO escribió status.json. Revisar a mano:"
                echo "    tail -50 /opt/portal659-monitor/monitor.log"
              fi
            else
              echo "⚠️  El monitor falló su primera corrida (exit $?). status.json puede no existir."
              echo "    tail -50 /opt/portal659-monitor/monitor.log"
              tail -50 /opt/portal659-monitor/monitor.log 2>/dev/null || true
            fi

            rm -f /tmp/code.tgz
            echo "Deploy completado!"
