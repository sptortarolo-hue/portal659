name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

# Un solo deploy a la vez: los pushes seguidos encolan en vez de solaparse
# (dos `compose up` concurrentes se pisan removiendo contenedores).
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 60m
          script: |
            set -euo pipefail
            cd /tmp
            SHA="${{ github.sha }}"
            curl -fsSL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o code.tgz "https://api.github.com/repos/sptortarolo-hue/portal659/tarball/$SHA"
            rm -rf /opt/portal659
            mkdir -p /opt/portal659
            tar -xzf code.tgz -C /opt/portal659 --strip-components=1

            # Swap 2G si no existe (evita OOM al buildear Next.js en un VPS de 1GB)
            SWAP_MB=$(free -m | awk '/^Swap:/{print $2}')
            if [ "${SWAP_MB:-0}" -lt 2048 ] && [ ! -f /swapfile2 ]; then
              fallocate -l 2G /swapfile2 && chmod 600 /swapfile2 && mkswap /swapfile2 && swapon /swapfile2
              grep -q 'swapfile2' /etc/fstab || echo '/swapfile2 none swap sw 0 0' >> /etc/fstab
            fi

            echo 'DATABASE_URL=${{ secrets.DATABASE_URL }}' > /opt/portal659/.env
            echo 'JWT_SECRET=${{ secrets.JWT_SECRET }}' >> /opt/portal659/.env
            echo 'NEXT_PUBLIC_SITE_URL=https://www.portal659.com.ar' >> /opt/portal659/.env
            echo 'POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}' >> /opt/portal659/.env
            echo 'UPLOAD_DIR=/app/uploads' >> /opt/portal659/.env
            echo 'RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}' >> /opt/portal659/.env
            echo "FROM_EMAIL=\"${{ secrets.FROM_EMAIL }}\"" >> /opt/portal659/.env
            echo 'MP_ACCESS_TOKEN=${{ secrets.MP_ACCESS_TOKEN }}' >> /opt/portal659/.env
            echo 'MP_PUBLIC_KEY=${{ secrets.MP_PUBLIC_KEY }}' >> /opt/portal659/.env
            echo 'MP_WEBHOOK_SECRET=${{ secrets.MP_WEBHOOK_SECRET }}' >> /opt/portal659/.env
            echo 'MP_CLIENT_ID=${{ secrets.MP_CLIENT_ID }}' >> /opt/portal659/.env
            echo 'MP_CLIENT_SECRET=${{ secrets.MP_CLIENT_SECRET }}' >> /opt/portal659/.env
            echo 'MP_TOKEN_KEY=${{ secrets.MP_TOKEN_KEY }}' >> /opt/portal659/.env
            # Llave maestra de Mercado Pago: encendida en producción (app de
            # MP con OAuth redirect + webhook ya configurados). Para apagar
            # todo MP sin redeploy de código, cambiar a MP_ENABLED=0.
            echo 'MP_ENABLED=1' >> /opt/portal659/.env
            echo 'UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }}' >> /opt/portal659/.env
            echo 'UPSTASH_REDIS_REST_TOKEN=${{ secrets.UPSTASH_REDIS_REST_TOKEN }}' >> /opt/portal659/.env
            echo 'VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}' >> /opt/portal659/.env
            echo 'VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}' >> /opt/portal659/.env
            echo 'VAPID_SUBJECT=${{ secrets.VAPID_SUBJECT }}' >> /opt/portal659/.env
            echo 'PRINT_BRIDGE_URL=http://printbridge:8791' >> /opt/portal659/.env
            PB_SECRET='${{ secrets.PRINT_BRIDGE_SECRET }}'
            if [ -z "$PB_SECRET" ]; then PB_SECRET=$(openssl rand -hex 24); fi
            echo "PRINT_BRIDGE_SECRET=$PB_SECRET" >> /opt/portal659/.env
            CS_SECRET='${{ secrets.CRON_SECRET }}'
            if [ -n "$CS_SECRET" ]; then echo "CRON_SECRET=$CS_SECRET" >> /opt/portal659/.env; fi
            echo 'LLM_API_KEY=${{ secrets.LLM_API_KEY }}' >> /opt/portal659/.env
            echo 'LLM_BASE_URL=${{ secrets.LLM_BASE_URL }}' >> /opt/portal659/.env
            echo 'LLM_MODEL=${{ secrets.LLM_MODEL }}' >> /opt/portal659/.env
            SN='${{ vars.LLM_SITE_NAME }}'; echo "LLM_SITE_NAME=${SN:-Portal 659 wa-bot}" >> /opt/portal659/.env
            WB_SECRET='${{ secrets.WA_BOT_SECRET }}'
            if [ -z "$WB_SECRET" ]; then WB_SECRET=$(openssl rand -hex 24); fi
            echo "WA_BOT_SECRET=$WB_SECRET" >> /opt/portal659/.env
            # Credenciales R2 para el backup self-managed (scripts/backup.sh).
            echo 'R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}' >> /opt/portal659/.env
            echo 'R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}' >> /opt/portal659/.env
            echo 'R2_ENDPOINT=${{ secrets.R2_ENDPOINT }}' >> /opt/portal659/.env
            echo 'R2_BUCKET=${{ secrets.R2_BUCKET }}' >> /opt/portal659/.env

            # Backup previo al deploy (DB + uploads → R2). Tolera primer arranque
            # (sin contenedores aún). Si falla NO bloquea el deploy — el backup
            # diario corre igual por cron.
            bash /opt/portal659/scripts/backup.sh || echo "WARNING: backup previo falló, continúa el deploy"

            cd /opt/portal659
            # Cert TLS para nginx :443. Si aún no pegaste el Origin CA de
            # Cloudflare en /opt/portal659-certs, se genera un placeholder
            # autofirmado para que nginx levante igual (el modo Strict se
            # enciende recién con el cert real instalado).
            mkdir -p /opt/portal659-certs
            if [ ! -f /opt/portal659-certs/origin.pem ]; then
              openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
                -keyout /opt/portal659-certs/origin.key \
                -out /opt/portal659-certs/origin.pem \
                -subj "/CN=portal659.com.ar" 2>/dev/null
            fi
            # Retry: absorbe carreras transitorias del daemon (ej. removal
            # of container ... is already in progress al recrear servicios).
            DEPLOYED=0
            for i in 1 2 3; do
              if docker compose up -d --build; then DEPLOYED=1; break; fi
              sleep 15
            done
            [ "$DEPLOYED" = "1" ]
            # nginx cachea el DNS del upstream al arrancar: si 'app' se recrea con un IP
            # nuevo, nginx apunta a un IP muerto y el sitio da 502. Restart = re-resuelve.
            docker restart portal659-nginx
            docker image prune -f

            # Backup diario self-managed (04:00 AR = 07:00 UTC). Self-healing:
            # reinstala rclone + script + crontab si faltan. /opt/portal659-backups
            # está FUERA de /opt/portal659: el deploy no lo borra nunca.
            mkdir -p /opt/portal659-backups/db /opt/portal659-backups/uploads
            cp -f /opt/portal659/scripts/backup.sh /opt/portal659-backups/backup.sh
            chmod +x /opt/portal659-backups/backup.sh
            if ! command -v rclone >/dev/null 2>&1; then
              curl -fsSL https://rclone.org/install.sh | bash
            fi
            printf '%s\n' \
              '07 7 * * * root /opt/portal659-backups/backup.sh >> /opt/portal659-backups/cron.log 2>&1' \
              > /etc/cron.d/portal659-backup
            chmod 644 /etc/cron.d/portal659-backup
            systemctl enable --now cron >/dev/null 2>&1 || service cron start >/dev/null 2>&1 || true

            # Recordatorios T-24/T-2 de turnos (cron self-managed, igual que backups).
            # Genera CRON_SECRET si falta; dispara cada 15 min contra el secreto.
            CRON_SECRET_VAL='${{ secrets.CRON_SECRET }}'
            if [ -z "$CRON_SECRET_VAL" ]; then CRON_SECRET_VAL=$(openssl rand -hex 16); fi
            echo "CRON_SECRET=$CRON_SECRET_VAL" >> /opt/portal659/.env
            printf '%s\n' \
              "*/15 * * * * root curl -fsS \"https://www.portal659.com.ar/api/cron/booking-reminders?secret=$CRON_SECRET_VAL\" >> /var/log/portal659-cron.log 2>&1" \
              > /etc/cron.d/portal659-reminders
            chmod 644 /etc/cron.d/portal659-reminders
            systemctl enable --now cron >/dev/null 2>&1 || service cron start >/dev/null 2>&1 || true

            rm -f /tmp/code.tgz
            echo "Deploy completado!"
