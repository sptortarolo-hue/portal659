name: Deploy to VPS

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 8277
          command_timeout: 30m
          script: |
            cd /tmp
            SHA=$(curl -fsSL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/sptortarolo-hue/portal659/commits/master | grep '"sha"' | head -1 | cut -d'"' -f4)
            curl -fsSL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o code.tgz "https://api.github.com/repos/sptortarolo-hue/portal659/tarball/$SHA"
            rm -rf /opt/portal659
            mkdir -p /opt/portal659
            tar -xzf code.tgz -C /opt/portal659 --strip-components=1

            echo 'NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}' > /opt/portal659/.env
            echo 'NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}' >> /opt/portal659/.env
            echo 'SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}' >> /opt/portal659/.env
            echo 'NEXT_PUBLIC_SITE_URL=https://www.portal659.com.ar' >> /opt/portal659/.env
            echo 'RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}' >> /opt/portal659/.env

            cd /opt/portal659
            docker compose up -d --build
            docker image prune -f
            rm -f /tmp/code.tgz
            echo "Deploy completado!"
