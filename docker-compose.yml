services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    container_name: portal659
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      - UPLOAD_DIR=${UPLOAD_DIR:-/app/uploads}
      - MP_ACCESS_TOKEN=${MP_ACCESS_TOKEN}
      - MP_PUBLIC_KEY=${MP_PUBLIC_KEY}
      - MP_WEBHOOK_SECRET=${MP_WEBHOOK_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - FROM_EMAIL=${FROM_EMAIL}
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN}
      - NEXT_PUBLIC_GOOGLE_MAPS_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_KEY}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - PRINT_BRIDGE_URL=${PRINT_BRIDGE_URL:-http://printbridge:8791}
      - PRINT_BRIDGE_SECRET=${PRINT_BRIDGE_SECRET}
      - LLM_API_KEY=${LLM_API_KEY}
    volumes:
      - uploads_data:/app/uploads
    expose:
      - "3000"
    networks:
      - portal659
    depends_on:
      db:
        condition: service_healthy

  printbridge:
    build:
      context: ./services/print-bridge
    container_name: portal659-printbridge
    restart: unless-stopped
    environment:
      - PORT=8791
      - PRINT_BRIDGE_SECRET=${PRINT_BRIDGE_SECRET}
    expose:
      - "8791"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8791/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - portal659

  db:
    image: postgres:15-alpine
    container_name: portal659-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portal659}
      POSTGRES_USER: ${POSTGRES_USER:-portal659}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./supabase/self-host/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portal659}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portal659

  nginx:
    image: nginx:alpine
    container_name: portal659-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Certificado Origin CA de Cloudflare (creado una vez en el VPS,
      # fuera de /opt/portal659 que el deploy borra):
      #   /opt/portal659-certs/origin.pem + origin.key
      - /opt/portal659-certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - portal659

networks:
  portal659:
    name: portal659

volumes:
  db_data:
  uploads_data: