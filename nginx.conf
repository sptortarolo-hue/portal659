# Puerto 80: sirve la app tal cual (sin redirect a https).
# El https lo impone Cloudflare en el edge (Always Use HTTPS); un redirect
# acá generaría loop infinito mientras el modo SSL sea Flexible/Full,
# porque Cloudflare no sigue redirects del origen.
server {
    listen 80;
    server_name portal659.com.ar www.portal659.com.ar;

    client_max_body_size 10M;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # La emisión fiscal ARCA son 3 SOAP secuenciales (hasta ~45s si ARCA
        # está lento): 90s para no cortar antes que Cloudflare (~100s).
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    location /_next/static/ {
        proxy_pass http://app:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /public/ {
        proxy_pass http://app:3000;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Relay WebSocket de impresión (app Portal Print conecta saliente por acá)
    location /printbridge {
        proxy_pass http://printbridge:8791;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # Relay WebSocket del bot de WhatsApp (APK Portal Wa Link conecta saliente por acá)
    location /wa {
        proxy_pass http://wabot:8792;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
}

# Puerto 443: TLS con certificado Origin CA de Cloudflare (para modo Strict).
# Certificado NO versionado (el deploy borra /opt/portal659):
#   /opt/portal659-certs/origin.pem  (certificado)
#   /opt/portal659-certs/origin.key  (clave privada)
# Montado como /etc/nginx/certs (ver docker-compose.yml).
# Si el cert aún no existe, el workflow genera un placeholder
# autofirmado para que nginx levante igual (Strict se enciende después).
server {
    listen 443 ssl;
    server_name portal659.com.ar www.portal659.com.ar;

    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Canónico www: el apex redirige preservando path y query.
    if ($host = portal659.com.ar) {
        return 301 https://www.portal659.com.ar$request_uri;
    }

    client_max_body_size 10M;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # La emisión fiscal ARCA son 3 SOAP secuenciales (hasta ~45s si ARCA
        # está lento): 90s para no cortar antes que Cloudflare (~100s).
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    location /_next/static/ {
        proxy_pass http://app:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /public/ {
        proxy_pass http://app:3000;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Relay WebSocket de impresión (app Portal Print conecta saliente por acá)
    location /printbridge {
        proxy_pass http://printbridge:8791;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # Relay WebSocket del bot de WhatsApp (APK Portal Wa Link conecta saliente por acá)
    location /wa {
        proxy_pass http://wabot:8792;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
}
