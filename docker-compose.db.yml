# Portal 659 - Postgres propio en el VPS (Opción B)
# Uso: docker compose -f docker-compose.db.yml up -d
# La DB NO se expone al público: el app (nginx + app) se conecta por red interna.

services:
  db:
    image: postgres:15-alpine
    container_name: portal659-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portal659}
      POSTGRES_USER: ${POSTGRES_USER:-portal659}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./supabase/self-host/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      # Solo localhost (para administrar/migrar desde el VPS).
      # NO expongas 5432 hacia Internet.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portal659}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portal659

networks:
  portal659:
    name: portal659

volumes:
  db_data: