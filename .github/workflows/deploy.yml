name: Deploy to VPS

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 8277
          command_timeout: 20m
          script: |
            cd /opt/portal659
            cp .env /tmp/.env.bak 2>/dev/null || true

            cd /tmp
            SHA=$(curl -fsSL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/sptortarolo-hue/portal659/commits/master | grep '"sha"' | head -1 | cut -d'"' -f4)
            curl -fsSL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o code.tgz "https://api.github.com/repos/sptortarolo-hue/portal659/tarball/$SHA"

            rm -rf /opt/portal659
            mkdir -p /opt/portal659
            tar -xzf code.tgz -C /opt/portal659 --strip-components=1

            cp /tmp/.env.bak /opt/portal659/.env 2>/dev/null || true

            cd /opt/portal659
            sed -i 's|NEXT_PUBLIC_SITE_URL=.*|NEXT_PUBLIC_SITE_URL=https://www.portal659.com.ar|' .env
            grep -q "RESEND_API_KEY" .env || echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> .env

            docker compose down
            docker compose up -d --build

            rm -f /tmp/code.tgz /tmp/.env.bak
            echo "Deploy completado!"
